<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OOT Royale Test</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfe;font:16px system-ui,sans-serif;overflow:hidden;touch-action:none}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center}
  #boot button,#boot label{background:#2a6;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:18px}
  #log{opacity:.7;font-size:13px;max-width:90vw;white-space:pre-wrap}
  #pad{position:fixed;inset:0;pointer-events:none;display:none}
  #pad .b{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:#fff3;border:2px solid #fff6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none;-webkit-user-select:none}
  #stick{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}
  #nub{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#fff6}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="boot">
  <div id="title">OOT Royale test build</div>
  <label id="pick">Choose oot.otr<input id="file" type="file" hidden></label>
  <button id="go" hidden>Start</button>
  <div id="log"></div>
</div>
<div id="pad"></div>
<script src="touch.js"></script>
<script src="loader.js"></script>
</body>
</html>
