<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOT ROM Extractor</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;background:#14161c;color:#e6e6e6;display:flex;height:100vh}
#side{width:300px;overflow:auto;padding:10px;background:#1b1e26;box-sizing:border-box}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#drop{margin:10px;padding:30px;border:3px dashed #5a6;border-radius:12px;text-align:center;font-size:18px}
#drop.over{background:#243}
#view{flex:1;width:100%;min-height:0;background:#0b0d12}
.row{padding:4px 6px;cursor:pointer;border-radius:4px}.row:hover{background:#2a2f3b}.row.sel{background:#35508a}
button{background:#3b6;border:0;color:#fff;padding:6px 10px;margin:2px;border-radius:5px;cursor:pointer}
button:disabled{background:#444}
#bar{padding:6px 10px;background:#1b1e26}
#log{font:12px monospace;white-space:pre-wrap;max-height:90px;overflow:auto;padding:4px 10px;color:#9c9}
h3{margin:10px 0 4px}
</style></head><body>
<div id="side"><div id="title"><b>OOT ROM Extractor</b></div><h3>Maps</h3><div id="scenes"></div><h3>Models</h3><div id="objs"></div></div>
<div id="main">
<div id="drop">Drag your Ocarina of Time ROM (.z64 / .v64 / .n64) here<br><small>Everything happens in your browser. Nothing is uploaded.</small></div>
<div id="bar">
<label><input type="checkbox" id="showRooms" checked> Rooms</label>
<label><input type="checkbox" id="showCol"> Collision</label>
<label><input type="checkbox" id="showAct" checked> Actors</label>
<button id="bObj" disabled>Save OBJ</button><button id="bPly" disabled>Save PLY</button>
<button id="bPng" disabled>Save top-down PNG</button><button id="bJson" disabled>Save analysis JSON</button>
<button id="bAll" disabled>Analyse ALL maps (JSON to share)</button>
</div>
<canvas id="view"></canvas><div id="log"></div></div>
<script>
// BEGIN_LIB
// ===== ROMLIB: everything that reads the ROM. No page code in here, so the tests can run it under Node. =====
const ROMLIB = (function () {
    'use strict';
    const be32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
    const be16 = (b, o) => (b[o] << 8) | b[o + 1];
    const s16 = (b, o) => { const v = (b[o] << 8) | b[o + 1]; return v & 0x8000 ? v - 0x10000 : v; };
    const s8 = v => (v & 0x80 ? v - 0x100 : v);

    // ---- the ROM file: any of the three byte orders people have them in ----------------------------------------------------------
    function normalizeRom(buffer) {
        const u8 = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
        if (u8.length < 0x100000) throw new Error('That file is too small to be an Ocarina of Time ROM.');
        const magic = be32(u8, 0);
        let out = u8, order = 'z64 (big endian)';
        if (magic === 0x37804012) {            // v64: every pair of bytes swapped
            out = new Uint8Array(u8.length);
            for (let i = 0; i + 1 < u8.length; i += 2) { out[i] = u8[i + 1]; out[i + 1] = u8[i]; }
            order = 'v64 (byte swapped), converted';
        } else if (magic === 0x40123780) {     // n64: every word reversed
            out = new Uint8Array(u8.length);
            for (let i = 0; i + 3 < u8.length; i += 4) { out[i] = u8[i + 3]; out[i + 1] = u8[i + 2]; out[i + 2] = u8[i + 1]; out[i + 3] = u8[i]; }
            order = 'n64 (little endian), converted';
        } else if (magic !== 0x80371240) {
            throw new Error('That does not look like an N64 ROM (unknown header).');
        }
        let title = '';
        for (let i = 0x20; i < 0x34; i++) title += out[i] >= 32 && out[i] < 127 ? String.fromCharCode(out[i]) : '';
        let code = '';
        for (let i = 0x3B; i < 0x3F; i++) code += String.fromCharCode(out[i]);
        return { rom: out, order, title: title.trim(), code, isZelda: /ZELDA/i.test(title) };
    }

    // ---- Yaz0 --------------------------------------------------------------------------------------------------------------------
    function yaz0(src) {
        if (!(src[0] === 0x59 && src[1] === 0x61 && src[2] === 0x7A && src[3] === 0x30)) return src;   // "Yaz0"; anything else is already plain
        const size = be32(src, 4);
        const out = new Uint8Array(size);
        let sp = 16, dp = 0;
        while (dp < size && sp < src.length) {
            const code = src[sp++];
            for (let bit = 0x80; bit && dp < size; bit >>= 1) {
                if (code & bit) { out[dp++] = src[sp++]; continue; }
                const b1 = src[sp++], b2 = src[sp++];
                const dist = (((b1 & 0x0F) << 8) | b2) + 1;
                let n = b1 >> 4;
                n = n === 0 ? src[sp++] + 0x12 : n + 2;
                for (let i = 0; i < n && dp < size; i++, dp++) out[dp] = dp - dist >= 0 ? out[dp - dist] : 0;
            }
        }
        return out;
    }

    // ---- the file table (dmadata) --------------------------------------------------------------------------------------------------
    function findDmaTable(rom) {
        const limit = Math.min(rom.length - 0x40, 0x400000);
        for (let o = 0; o < limit; o += 0x10) {
            if (be32(rom, o) === 0 && be32(rom, o + 4) === 0x1060 && be32(rom, o + 8) === 0 && be32(rom, o + 12) === 0 && be32(rom, o + 16) === 0x1060) {
                const entries = [];
                for (let i = 0; i < 6000 && o + i * 16 + 16 <= rom.length; i++) {
                    const p = o + i * 16;
                    const e = { vs: be32(rom, p), ve: be32(rom, p + 4), ps: be32(rom, p + 8), pe: be32(rom, p + 12), index: i };
                    if (e.vs === 0 && e.ve === 0 && e.ps === 0 && e.pe === 0 && i > 2) break;
                    if (e.ve < e.vs || e.vs > 0x10000000) break;
                    entries.push(e);
                }
                if (entries.length > 100) return { offset: o, entries };
            }
        }
        throw new Error('Could not find the ROM\'s file table. Is this an Ocarina of Time ROM?');
    }

    function fileBytes(rom, e) {
        if (e.ps === 0xFFFFFFFF || e.ve <= e.vs) return null;
        if (e.pe === 0) return rom.subarray(e.ps, e.ps + (e.ve - e.vs));
        return yaz0(rom.subarray(e.ps, e.pe));
    }

    // ---- the tables that live in the code file ---------------------------------------------------------------------------------------
    // The scene table is 110 entries of 0x14 bytes: {scene start, scene end, title card start, title card end, ...}, every address one of the
    // ROM's own files. Rather than hard-code where it is in each ROM version, find the longest run of entries that fit that pattern.
    function findTable(rom, dma, stride, matcher, minRun, maxIndex, exclude, accept) {
        const known = new Map();
        for (const e of dma.entries) if (e.ve > e.vs && e.ps !== 0xFFFFFFFF) known.set(e.vs, e);
        let best = null;
        const limit = Math.min(maxIndex || 120, dma.entries.length);
        for (let i = 0; i < limit; i++) {
            const e = dma.entries[i];
            const size = e.ve - e.vs;
            if (size < 0x20000 || size > 0x600000 || e.ps === 0xFFFFFFFF) continue;
            const data = fileBytes(rom, e);
            if (!data) continue;
            for (let off = 0; off + stride * minRun <= data.length; off += 4) {
                if (exclude && exclude.file === i && off >= exclude.from && off < exclude.to) { off = exclude.to - 4; continue; }
                let k = 0;
                while (off + stride * (k + 1) <= data.length && matcher(data, off + stride * k, known, k)) k++;
                if (k >= minRun && (!best || k > best.count) && (!accept || accept(data, off, k))) best = { file: i, offset: off, count: k, data };
                if (k > 1) off += 4 * (k - 1) * (stride / 4) - 4 + (stride === 0x14 ? 0 : 0);
            }
        }
        return best;
    }

    function findSceneTable(rom, dma) {
        const matcher = (d, o, known) => {
            const a = be32(d, o), b = be32(d, o + 4), c = be32(d, o + 8), dd = be32(d, o + 12);
            const ka = known.get(a);
            if (!ka || ka.ve !== b) return false;
            if (c === 0 && dd === 0) return true;
            const kc = known.get(c);
            return !!kc && kc.ve === dd;
        };
        const found = findTable(rom, dma, 0x14, matcher, 30, 120);
        if (!found) throw new Error('Could not find the scene table in the ROM\'s code file.');
        const scenes = [];
        for (let k = 0; k < Math.min(found.count, 110); k++) {
            const o = found.offset + k * 0x14;
            scenes.push({ id: k, sceneStart: be32(found.data, o), sceneEnd: be32(found.data, o + 4), titleStart: be32(found.data, o + 8), titleEnd: be32(found.data, o + 12) });
        }
        return { scenes, codeFile: found.file, offset: found.offset };
    }

    // The object table: 8 bytes each {start, end}; entry 0 is empty and unused ones are {0, 0}.
    function findObjectTable(rom, dma, scenes) {
        const matcher = (d, o, known, k) => {
            const a = be32(d, o), b = be32(d, o + 4);
            if (a === 0 && b === 0) return k < 400;
            const ka = known.get(a);
            return !!ka && ka.ve === b;
        };
        const nonZero = (d, o, k) => { let n = 0; for (let j = 0; j < k; j++) if (be32(d, o + j * 8)) n++; return n >= 60; };
        const st = scenes ? { file: scenes.codeFile, from: scenes.offset, to: scenes.offset + scenes.scenes.length * 0x14 } : null;
        const found = findTable(rom, dma, 8, matcher, 150, 120, st, nonZero);
        if (!found) return null;
        // zero entries before the table would shift every index: the real table starts with exactly one empty entry
        let first = 0;
        while (first < found.count && !be32(found.data, found.offset + first * 8)) first++;
        const base = found.offset + Math.max(0, first - 1) * 8;
        const objects = [];
        for (let k = 0; k < Math.min(found.count - Math.max(0, first - 1), 402); k++) objects.push({ id: k, start: be32(found.data, base + k * 8), end: be32(found.data, base + k * 8 + 4) });
        return { objects, codeFile: found.file };
    }

    // ---- scene and room headers ------------------------------------------------------------------------------------------------------
    function headerCommands(b) {
        const cmds = [];
        for (let o = 0; o + 8 <= b.length && cmds.length < 80; o += 8) {
            const id = b[o];
            cmds.push({ id, d1: b[o + 1], d2: be32(b, o + 4), w0: be32(b, o), off: o });
            if (id === 0x14) break;
        }
        return cmds;
    }
    const segOff = (addr, seg) => ((addr >>> 24) === seg ? addr & 0xFFFFFF : -1);

    function readActor(b, o) {
        return { id: be16(b, o), x: s16(b, o + 2), y: s16(b, o + 4), z: s16(b, o + 6), rx: s16(b, o + 8), ry: s16(b, o + 10), rz: s16(b, o + 12), params: be16(b, o + 14) };
    }

    function parseCollision(b, off) {
        if (off < 0 || off + 0x2C > b.length) return null;
        const c = { min: [s16(b, off), s16(b, off + 2), s16(b, off + 4)], max: [s16(b, off + 6), s16(b, off + 8), s16(b, off + 10)] };
        const nv = be16(b, off + 12), vp = segOff(be32(b, off + 16), 2);
        const np = be16(b, off + 20), pp = segOff(be32(b, off + 24), 2);
        const sp = segOff(be32(b, off + 28), 2);
        const nw = be16(b, off + 36), wp = segOff(be32(b, off + 40), 2);
        if (vp < 0 || pp < 0 || vp + nv * 6 > b.length || pp + np * 16 > b.length || nv > 20000 || np > 40000) return null;
        const verts = new Float32Array(nv * 3);
        for (let i = 0; i < nv; i++) { verts[i * 3] = s16(b, vp + i * 6); verts[i * 3 + 1] = s16(b, vp + i * 6 + 2); verts[i * 3 + 2] = s16(b, vp + i * 6 + 4); }
        const tris = [];   // each: [a, b, c, exitIndex, floorProperty, wallType, nx, ny, nz]
        for (let i = 0; i < np; i++) {
            const o = pp + i * 16;
            const type = be16(b, o);
            const a = be16(b, o + 2) & 0x1FFF, bb = be16(b, o + 4) & 0x1FFF, cc = be16(b, o + 6) & 0x1FFF;
            if (a >= nv || bb >= nv || cc >= nv) continue;
            let exit = 0, floorType = 0;
            if (sp >= 0 && sp + (type + 1) * 8 <= b.length) { const w0 = be32(b, sp + type * 8); exit = (w0 >>> 8) & 0x1F; floorType = (w0 >>> 13) & 0x1F; }
            tris.push([a, bb, cc, exit, floorType, 0, s16(b, o + 8) / 32767, s16(b, o + 10) / 32767, s16(b, o + 12) / 32767]);
        }
        const water = [];
        if (wp >= 0 && nw < 200) for (let i = 0; i < nw && wp + i * 16 + 16 <= b.length; i++) {
            const o = wp + i * 16;
            water.push({ x: s16(b, o), y: s16(b, o + 2), z: s16(b, o + 4), w: be16(b, o + 6), l: be16(b, o + 8) });
        }
        c.verts = verts; c.tris = tris; c.water = water;
        return c;
    }

    function parseScene(sceneBytes, loadRoom) {
        const out = { spawns: [], actors: [], transitions: [], exits: [], rooms: [], collision: null };
        for (const cmd of headerCommands(sceneBytes)) {
            const o = segOff(cmd.d2, 2);
            switch (cmd.id) {
                case 0x00: if (o >= 0) for (let i = 0; i < cmd.d1 && o + i * 16 + 16 <= sceneBytes.length; i++) out.spawns.push(readActor(sceneBytes, o + i * 16)); break;
                case 0x01: if (o >= 0) for (let i = 0; i < cmd.d1 && o + i * 16 + 16 <= sceneBytes.length; i++) out.actors.push(readActor(sceneBytes, o + i * 16)); break;
                case 0x03: out.collision = parseCollision(sceneBytes, o); break;
                case 0x0E: if (o >= 0) for (let i = 0; i < cmd.d1 && o + i * 16 + 16 <= sceneBytes.length; i++) {
                    const p = o + i * 16;
                    out.transitions.push({ front: s8(sceneBytes[p]), back: s8(sceneBytes[p + 2]), actor: be16(sceneBytes, p + 4), x: s16(sceneBytes, p + 6), y: s16(sceneBytes, p + 8), z: s16(sceneBytes, p + 10), ry: s16(sceneBytes, p + 12), params: be16(sceneBytes, p + 14) });
                } break;
                case 0x13: if (o >= 0) for (let i = 0; i < 64 && o + i * 2 + 2 <= sceneBytes.length; i++) out.exits.push(be16(sceneBytes, o + i * 2)); break;
                case 0x04: if (o >= 0) for (let i = 0; i < cmd.d1 && o + i * 8 + 8 <= sceneBytes.length; i++) {
                    const vs = be32(sceneBytes, o + i * 8), ve = be32(sceneBytes, o + i * 8 + 4);
                    const bytes = loadRoom ? loadRoom(vs, ve) : null;
                    out.rooms.push({ index: i, vs, ve, bytes });
                } break;
                default: break;
            }
        }
        // each room's own actors and mesh
        for (const room of out.rooms) {
            room.actors = [];
            room.meshes = [];
            if (!room.bytes) continue;
            for (const cmd of headerCommands(room.bytes)) {
                const o = segOff(cmd.d2, 3);
                if (cmd.id === 0x01 && o >= 0) for (let i = 0; i < cmd.d1 && o + i * 16 + 16 <= room.bytes.length; i++) { const a = readActor(room.bytes, o + i * 16); a.room = room.index; room.actors.push(a); }
                if (cmd.id === 0x0A && o >= 0) {
                    const type = room.bytes[o], num = room.bytes[o + 1];
                    const start = segOff(be32(room.bytes, o + 4), 3);
                    if ((type === 0 || type === 2) && start >= 0 && num < 128) {
                        const step = type === 0 ? 8 : 16, add = type === 0 ? 0 : 8;
                        for (let i = 0; i < num && start + i * step + step <= room.bytes.length; i++) {
                            const p = start + i * step + add;
                            room.meshes.push({ opa: be32(room.bytes, p), xlu: be32(room.bytes, p + 4) });
                        }
                    }
                }
            }
        }
        return out;
    }

    // ---- display lists (F3DEX2) -> triangles ---------------------------------------------------------------------------------------------
    const G_LIGHTING = 0x20000;
    function walkDisplayList(start, segs, opts) {
        opts = opts || {};
        const maxTris = opts.maxTris || 1500000;
        const pos = [], col = [];
        const vtx = new Array(32);
        let mode = 0;
        const stack = [];
        let addr = start;
        let steps = 0, depth = 0;
        const base = [0.78, 0.76, 0.70];
        const fetch = (a, n) => {
            const bytes = segs[a >>> 24];
            const off = a & 0xFFFFFF;
            return bytes && off + n <= bytes.length ? { bytes, off } : null;
        };
        const push = (i) => {
            const v = vtx[i];
            if (!v) return false;
            pos.push(v.x, v.y, v.z);
            col.push(v.r, v.g, v.b);
            return true;
        };
        const tri = (a, b, c) => {
            if (!vtx[a] || !vtx[b] || !vtx[c]) return;
            push(a); push(b); push(c);
        };
        while (steps++ < 400000 && pos.length / 9 < maxTris) {
            const f = fetch(addr, 8);
            if (!f) { if (!stack.length) break; addr = stack.pop(); depth--; continue; }
            const w0 = be32(f.bytes, f.off), w1 = be32(f.bytes, f.off + 4);
            const op = w0 >>> 24;
            addr = (addr + 8) >>> 0;
            if (op === 0xDF) { if (!stack.length) break; addr = stack.pop(); depth--; }
            else if (op === 0xDE) {
                if (((w0 >>> 16) & 0xFF) === 1) addr = w1;
                else if (depth < 12) { stack.push(addr); depth++; addr = w1; }
            } else if (op === 0x01) {
                const n = (w0 >>> 12) & 0xFF, v0 = ((w0 >>> 1) & 0x7F) - n;
                const vf = fetch(w1, n * 16);
                if (vf && v0 >= 0 && v0 + n <= 32) for (let i = 0; i < n; i++) {
                    const o = vf.off + i * 16, b = vf.bytes;
                    const x = s16(b, o), y = s16(b, o + 2), z = s16(b, o + 4);
                    let r, g, bl;
                    if (mode & G_LIGHTING) {            // the bytes are a normal: shade it from a fixed light
                        const nx = s8(b[o + 12]) / 127, ny = s8(b[o + 13]) / 127, nz = s8(b[o + 14]) / 127;
                        const l = Math.max(0.3, Math.min(1, nx * 0.35 + ny * 0.8 + nz * 0.45));
                        r = base[0] * l; g = base[1] * l; bl = base[2] * l;
                    } else { r = b[o + 12] / 255; g = b[o + 13] / 255; bl = b[o + 14] / 255; }
                    vtx[v0 + i] = { x, y, z, r, g, b: bl };
                }
            } else if (op === 0x05) tri(((w0 >>> 16) & 0xFF) >> 1, ((w0 >>> 8) & 0xFF) >> 1, (w0 & 0xFF) >> 1);
            else if (op === 0x06 || op === 0x07) {
                tri(((w0 >>> 16) & 0xFF) >> 1, ((w0 >>> 8) & 0xFF) >> 1, (w0 & 0xFF) >> 1);
                tri(((w1 >>> 16) & 0xFF) >> 1, ((w1 >>> 8) & 0xFF) >> 1, (w1 & 0xFF) >> 1);
            } else if (op === 0xD9) mode = ((mode & (w0 & 0xFFFFFF)) | w1) >>> 0;
        }
        return { pos: new Float32Array(pos), col: new Float32Array(col), tris: pos.length / 9 };
    }

    function mergeMeshes(list) {
        let n = 0;
        for (const m of list) n += m.pos.length;
        const pos = new Float32Array(n), col = new Float32Array(n);
        let o = 0;
        for (const m of list) { pos.set(m.pos, o); col.set(m.col, o); o += m.pos.length; }
        return { pos, col, tris: n / 9 };
    }

    function buildRoomMesh(room, sceneBytes) {
        const parts = [];
        const segs = { 2: sceneBytes, 3: room.bytes };
        for (const m of room.meshes) for (const dl of [m.opa, m.xlu]) if (dl && (dl >>> 24) === 3) parts.push(walkDisplayList(dl, segs));
        return mergeMeshes(parts);
    }

    // ---- objects: models are display lists inside object files; find them, and the skeletons that arrange them ----------------------------
    const DL_OPS = new Set([0x01, 0x03, 0x04, 0x05, 0x06, 0x07, 0xD7, 0xD9, 0xDA, 0xDB, 0xDC, 0xDD, 0xDE, 0xDF, 0xE1, 0xE2, 0xE3, 0xE4, 0xE5, 0xE6, 0xE7, 0xE8, 0xE9, 0xEB, 0xF0, 0xF2, 0xF3, 0xF4, 0xF5, 0xF6, 0xF7, 0xF8, 0xF9, 0xFA, 0xFB, 0xFC, 0xFD, 0xFE, 0xFF, 0xD0, 0xD1, 0xD2, 0xD3, 0xD4, 0xD5, 0xD6, 0xDC, 0xE0, 0xEA, 0xEC, 0xED, 0xEE, 0xEF]);
    function findDisplayLists(obj, limit) {
        const found = [];
        let coveredUntil = 0;
        const segs = { 6: obj };
        for (let o = 0; o + 8 <= obj.length && found.length < (limit || 2500); o += 8) {
            if (o < coveredUntil) continue;
            const first = obj[o];
            if (first !== 0xE7 && first !== 0xFD && first !== 0xD9 && first !== 0x01 && first !== 0xDE && first !== 0xE1 && first !== 0xFC && first !== 0xDA && first !== 0xFB) continue;
            // walk it in place, checking every command is one the chip has
            let p = o, ok = false;
            for (let i = 0; i < 2000 && p + 8 <= obj.length; i++, p += 8) {
                const op = obj[p];
                if (!DL_OPS.has(op)) break;
                if (op === 0xDF) { ok = i > 0; p += 8; break; }
                if (op === 0x01) { const a = be32(obj, p + 4); if ((a >>> 24) !== 6 || (a & 0xFFFFFF) >= obj.length) break; }
            }
            if (!ok) continue;
            const m = walkDisplayList((6 << 24) | o, segs, { maxTris: 40000 });
            if (m.tris < 1) continue;
            found.push({ offset: o, end: p, tris: m.tris });
            coveredUntil = p;
        }
        return found;
    }

    function findSkeletons(obj) {
        const found = [];
        for (let o = 0; o + 8 <= obj.length && found.length < 40; o += 4) {
            const p = be32(obj, o);
            if ((p >>> 24) !== 6) continue;
            const n = obj[o + 4];
            if (n < 3 || n > 60) continue;
            const table = p & 0xFFFFFF;
            if (table + 4 * n > obj.length || table % 4) continue;
            for (const stride of [12, 16]) {
                const limbs = [];
                let good = true, withDl = 0;
                for (let i = 0; i < n && good; i++) {
                    const lp = be32(obj, table + 4 * i);
                    if ((lp >>> 24) !== 6) { good = false; break; }
                    const lo = lp & 0xFFFFFF;
                    if (lo + stride > obj.length) { good = false; break; }
                    const child = obj[lo + 6], sibling = obj[lo + 7];
                    const dl = be32(obj, lo + 8), dl2 = stride === 16 ? be32(obj, lo + 12) : 0;
                    const dlOk = d => d === 0 || ((d >>> 24) === 6 && (d & 0xFFFFFF) < obj.length) || (stride === 16 && d === 0x80000000);
                    if (!(child === 0xFF || child < n) || !(sibling === 0xFF || sibling < n) || !dlOk(dl) || (stride === 16 && !dlOk(dl2))) { good = false; break; }
                    if (dl !== 0) withDl++;
