name: CI

# Windows (MSVC) and Android (NDK) are the only supported platforms, so those are the builds that gate changes.
# The Linux job exists only because it is the cheapest place to run the unit tests under sanitizers.
on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch ENet only
        run: git submodule update --init --depth 1 third_party/enet
      - name: Configure (MSVC)
        run: cmake -S server -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  android-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch ENet only
        run: git submodule update --init --depth 1 third_party/enet
      - name: Cross-compile for arm64 (build only, cannot run on the runner)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK at $NDK"
          cmake -S server -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build

  linux-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch ENet only
        run: git submodule update --init --depth 1 third_party/enet
      - name: Build and test with UBSan
        run: |
          cmake -S server -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
          ctest --test-dir build --output-on-failure
