name: CI

# Windows (MSVC) and Android (NDK) are the only supported platforms, so those are the builds that gate changes.
# The Linux job exists only because it is the cheapest place to run the unit tests under sanitizers.
on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

jobs:
  mod-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ./scripts/link_mod.sh
          python3 scripts/check_mod_layout.py --copied third_party/Shipwright-Android/soh/soh/Enhancements/Royale
          python3 scripts/test_water_draw_buffers.py
          python3 -m unittest discover -s tools/token_monitor -p 'test_*.py'

  android-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch ENet only
        run: git submodule update --init --depth 1 third_party/enet
      - name: Cross-compile for arm64 (build only, cannot run on the runner)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK at $NDK"
          cmake -S server -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build

  linux-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch ENet only
        run: git submodule update --init --depth 1 third_party/enet
      - name: Validate generated item normal and bump maps
        run: python3 scripts/test_item_surface_maps.py
      - name: Compile material shaders for desktop OpenGL and Android GLES
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python3 scripts/test_item_surface_shaders.py
      - name: Validate Kingdom authoring
        run: |
          python3 -m pip install numpy
          python3 scripts/test_kingdom_authoring.py
      - name: Validate Riftlands map integration and packed assets
        run: |
          python3 tools/maps/riftlands/scale_audit.py
          python3 scripts/test_riftlands_integration.py
      - name: Validate water draw allocation bounds
        run: python3 scripts/test_water_draw_buffers.py
      - name: Build and test with UBSan
        run: |
          cmake -S server -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
          ctest --test-dir build --output-on-failure
