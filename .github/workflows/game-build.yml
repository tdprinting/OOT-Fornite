name: Game build

# Builds the whole game (Shipwright-Android fork + our patches + the Royale mod). Slow (the fork is large), so it only
# runs when game-facing files change, or on demand. It compiles and links but does not run the game: that needs your ROM.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "mod/**"
      - "patches/**"
      - "cmake/**"
      - "shared/**"
      - "server/**.h"
      - "client/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/game-build.yml"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules (fork, its submodules, ENet)
        run: git submodule update --init --recursive --depth 1
      - name: Apply patches and copy the mod into the fork
        run: |
          ./scripts/apply_patches.sh
          ./scripts/link_mod.sh
          pip install pillow
          ./scripts/apply_logo.sh
          echo "#define ROYALE_BUILD_VERSION \"0.${{ github.run_number }}\"" > mod/Royale/build_version.h
          cat mod/Royale/build_version.h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK/NDK pieces the fork asks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" "platforms;android-33" "platforms;android-31"
      - name: Build the release APK (arm64-v8a)
        working-directory: third_party/Shipwright-Android/Android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: royale-android-apk
          path: third_party/Shipwright-Android/Android/app/build/outputs/apk/release/*.apk
      - name: Keep the unstripped libraries (to read crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: royale-android-symbols
          path: |
            third_party/Shipwright-Android/Android/app/build/intermediates/cxx/**/obj/arm64-v8a/*.so
            third_party/Shipwright-Android/Android/app/build/intermediates/merged_native_libs/**/*.so
          if-no-files-found: warn
