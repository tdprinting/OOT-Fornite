name: Game build

# Builds the whole game (Shipwright-Android fork + our patches + the Royale mod). Slow (the fork is large), so it only
# runs when game-facing files change, or on demand. Every successful run publishes a release (see the last step). It compiles and links but does not run the game: that needs your ROM.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "mod/**"
      - "patches/**"
      - "cmake/**"
      - "shared/**"
      - "server/**.h"
      - "client/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/game-build.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: write   # to publish the release the in-game updater downloads

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules (fork, its submodules, ENet)
        run: git submodule update --init --recursive --depth 1
      - name: Apply patches and copy the mod into the fork
        run: |
          ./scripts/apply_patches.sh
          ./scripts/link_mod.sh
          pip install pillow
          ./scripts/apply_logo.sh
          echo "#define ROYALE_BUILD_VERSION \"0.${{ github.run_number }}\"" > mod/Royale/build_version.h
          cat mod/Royale/build_version.h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK/NDK pieces the fork asks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" "platforms;android-33" "platforms;android-31"
      - name: Sign with our fixed key (so each build can install over the last one)
        run: |
          # Android only installs an update over an app signed with the same key. The runner would otherwise invent a fresh
          # debug key every run, so every build would be a "different app". This is a throwaway key, not a secret: it only
          # makes our builds line up with each other.
          mkdir -p ~/.android
          cp scripts/royale-debug.keystore ~/.android/debug.keystore
      - name: Build the release APK (arm64-v8a)
        working-directory: third_party/Shipwright-Android/Android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: royale-android-apk
          path: third_party/Shipwright-Android/Android/app/build/outputs/apk/release/*.apk
      - name: Keep the unstripped libraries (to read crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: royale-android-symbols
          path: |
            third_party/Shipwright-Android/Android/app/build/intermediates/cxx/**/obj/arm64-v8a/*.so
            third_party/Shipwright-Android/Android/app/build/intermediates/merged_native_libs/**/*.so
          if-no-files-found: warn
      - name: Publish the build (what the in-game updater downloads)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Every successful build is published, numbered by this run (the game's version is "0.<number>"):
          #   - builds of the default branch are normal releases, the ones the updater offers by default;
          #   - builds of any other branch (a pull request being tested) are pre-releases, offered only when
          #     "Include test builds" is ticked in the game's updater. They never become "latest".
          # Runs can finish out of order, so after publishing we point "latest" at the highest normal build, whatever finished last.
          N=${{ github.run_number }}
          cp third_party/Shipwright-Android/Android/app/build/outputs/apk/release/*.apk TDawgsBattleRoyale.apk
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            gh release create "build-$N" TDawgsBattleRoyale.apk --latest=false \
              --title "Build 0.$N" \
              --notes "Automatic build of ${{ github.sha }}. Install it from the game's Battle Royale menu > Game updates."
          else
            gh release create "build-$N" TDawgsBattleRoyale.apk --prerelease --latest=false \
              --title "Test build 0.$N ($BRANCH)" \
              --notes "Test build of branch $BRANCH (${{ github.sha }}), made before merging. Offered in Game updates when 'Include test builds' is ticked."
          fi
          NEWEST=$(gh release list --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease | not) | .tagName | ltrimstr("build-") | tonumber] | max // empty')
          [ -n "$NEWEST" ] && gh release edit "build-$NEWEST" --latest
          # Tidy up: keep the 10 highest normal builds and the 10 highest test builds (by number, not by date). Never the newest.
          for KIND in false true; do
            gh release list --limit 200 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease == $KIND) | .tagName | ltrimstr(\"build-\") | tonumber] | sort | reverse | .[10:][] | \"build-\(.)\"" \
              | xargs -r -n1 gh release delete --cleanup-tag --yes
          done
